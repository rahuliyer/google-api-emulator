[project]
name = "google-api-emulator"
version = "0.1.0"
description = "Local Google API emulator for agent tests (People API first)"
readme = "README.md"
authors = [
    { name = "Rahul Iyer", email = "rahulair@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
]

[project.scripts]
google-api-emulator = "google_api_emulator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
